# The deployment's config (plat5 docs/concepts/config.md): settings, the tree's
# kinds, the roles, and the service files, one per service.
# plat5 start applies it to the local stack; plat5 apply applies it anywhere.
#
# Kinds and roles are yours: Plat5 names neither. Identity's and audit's routes
# are in their service files, written for these kinds by plat5 routes generate;
# run it again after changing the kinds. This starter's API is services/api.yml.
# To add a service, write services/<name>.yml and list it under services.
deletion_grace: 30d
reserved_slugs: [new, settings, api, admin]
users:
  name:   # which token claims name a person at sign-in, and when (plat5 docs/reference/idp.md)
    claims: [name, preferred_username]
    sync: first_sign_in
kinds:
  organization:
    path: /orgs/{organization}
  project:
    parent: organization
    path: /projects/{project}
    bind_creator: false     # its creator works through their roles above
  environment:
    parent: project
    path: /envs/{environment}
    # Part of its project: reached through its project's permissions. Its routes
    # in services/identity.yml require project:read, project:write, …, and it's
    # listed to whoever can read its project.
    list_permission: project:read
    bind_creator: false
# The example roles (plat5 docs/reference/config/roles.md). Whoever holds
# bindings:write can grant any role, so admin, with "*", is the only role that
# holds it. admin also shapes the tree, creating and deleting projects and
# environments; developer and viewer work inside it.
roles:
  admin:
    permissions: ["*"]
    bindable_at: [organization, project, environment]
  member:
    permissions: [organization:read]
    bindable_at: [organization]
  developer:
    includes: [member]
    permissions: [project:read, project:write, project:bindings:read]
    bindable_at: [organization, project, environment]
  viewer:
    includes: [member]
    permissions: [project:read]
    bindable_at: [organization, project, environment]
creator_role: admin
# Rate limits (plat5 docs/reference/config/rate-limits.md). defaults.rate_limit
# names the policies of every route that names none, and of route checks; a
# route says rate_limit: false to have none.
rate_limits:
  standard: { requests: 100, window_seconds: 1 }
defaults:
  rate_limit: [standard]
services:
  - services/identity.yml
  - services/audit.yml
  - services/api.yml
