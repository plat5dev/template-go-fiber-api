services:
  api:
    # url comes from plat5.yml upstreams when using the CLI
    user:
      routes:
        - path: /user/profile
          upstream: /users/{subject.user_id}/profile
          methods: [GET, PUT]
    # Writes need projects:write. roles.yml grants it to members; a key can narrow it away.
    member:
      routes:
        - path: /member/projects
          upstream: /organizations/{subject.organization_id}/members/{subject.member_id}/projects
          methods:
            GET:
            POST:
              required_scopes: [projects:write]
        - path: /member/projects/{project_id}
          upstream: /organizations/{subject.organization_id}/members/{subject.member_id}/projects/{path.project_id}
          methods:
            GET:
            PATCH:
              required_scopes: [projects:write]
            DELETE:
              required_scopes: [projects:write]
        - path: /member/projects/{project_id}/tasks
          upstream: /organizations/{subject.organization_id}/members/{subject.member_id}/projects/{path.project_id}/tasks
          methods:
            GET:
            POST:
              required_scopes: [projects:write]
        - path: /member/projects/{project_id}/tasks/{task_id}
          upstream: /organizations/{subject.organization_id}/members/{subject.member_id}/projects/{path.project_id}/tasks/{path.task_id}
          methods:
            GET:
            PATCH:
              required_scopes: [projects:write]
            DELETE:
              required_scopes: [projects:write]
