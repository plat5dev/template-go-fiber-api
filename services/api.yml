# The API's routes (plat5 docs/reference/config/services.md): tasks inside an
# environment, and the person's own profile. The gateway forwards an
# environment's routes with its id in the path and the caller's member id in
# X-Plat5-Member-Id, and the profile with the caller's user id in the path.
# The API checks a task's assignee against TASK_ASSIGNEE_PERMISSION on the
# project, which matches the permission reading tasks requires here
# (project:read): rename one, rename the other.
api:
  url: http://api:3000
  scopes:
    environment:
      upstream_prefix: /environments/{environment.id}
      routes:
        - path: /tasks
          methods:
            GET: { required_permissions: [project:read] }
            POST: { required_permissions: [project:write] }
        - path: /tasks/{task_id}
          methods:
            GET: { required_permissions: [project:read] }
            PATCH: { required_permissions: [project:write] }
            DELETE: { required_permissions: [project:write] }
    user:
      routes:
        - path: /user/profile
          upstream: /users/{user.id}/profile
          methods: [GET, PUT]
