name: go-fiber-api
description: Go + Fiber reference API (profiles, projects, tasks)

upstreams:
  api: "3000"

routes:
  - ./routes.identity.yml
  - ./routes.audit.yml
  - ./routes.yml

substitute:
  - go.mod

# plat5 start runs the API and the starter web app from this compose file. The web
# app's origin is allowed to sign in with local Auth.
app:
  compose: docker-compose.yml
  web: http://localhost:3001

# To run the API on your own machine instead: plat5 start -x app, then
next:
  - go mod tidy
  - go run .
