name: go-fiber-api
kind: api
description: Go + Fiber reference API (tasks inside a project, and the person's profile)

# The project's config: plat5 init copies it, and the service files it lists,
# to the project's root, adding only the customer console's origin.
config: plat5.yml

# What the operator plane may call on this API. plat5 init adds it to
# operator.routes.yml.
operator_routes: ./routes.operator.yml

# plat5 init copies this starter into a project's api/ folder. plat5 start
# runs the API from this compose file.
app:
  compose: docker-compose.yml

# To run the API on your own machine instead: plat5 start -x app, then
next:
  - go mod tidy
  - TASK_ASSIGNEE_PERMISSION=project:read go run .
