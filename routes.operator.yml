# What the operator plane may call on this API (operator
# docs/reference/routes.md). plat5 init adds it to the project's
# operator.routes.yml. The paths are the API's own, by node id: the operator
# gateway forwards them unchanged. Read-only; add methods there for operator
# writes. as_member also serves each route at /as/{member}, acting as that
# member: a write there carries the X-Plat5-Member-Id the API needs to record
# a task's author.
services:
  api:
    url: http://api:3000
    routes:
      - path: /environments/{environment_id}/tasks
        node: environment_id
        as_member: true
        methods: [GET]
      - path: /environments/{environment_id}/tasks/{task_id}
        node: environment_id
        as_member: true
        methods: [GET]
