# What staff may call on this API through the operator gateway (operator
# docs/routes.md). plat5 init adds it to the project's operator.routes.yml, where
# plat5.yml's upstreams.api says where the API is. The paths are the API's own: the
# operator gateway forwards them unchanged, with the org in the path. Read-only;
# add methods there for staff writes.
upstreams:
  api:
    routes:
      - path: /organizations/{organization_id}/projects
        methods: [GET]
      - path: /organizations/{organization_id}/projects/{project_id}
        methods: [GET]
      - path: /organizations/{organization_id}/projects/{project_id}/tasks
        methods: [GET]
      - path: /organizations/{organization_id}/projects/{project_id}/tasks/{task_id}
        methods: [GET]
