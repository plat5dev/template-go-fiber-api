# No name: the project is the directory name, so each app made from this starter is its own.

services:
  api:
    build:
      context: .
      target: local
    labels:
      service.name: api
      service.namespace: api
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      INTERNAL_PORT: 3001
      DATABASE_PATH: /data/app.db
      OTEL_SERVICE_NAME: api
      OTEL_SERVICE_NAMESPACE: api
      DEPLOYMENT_ENV: docker
      # Where to send traces and metrics. plat5 start sets it when observability is on.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}

    volumes:
      - .:/app
      - sqlite_data:/data
      - go_mod_cache:/go/pkg/mod
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-fsS",
          "http://127.0.0.1:3001/health/ready",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # The starter web app: every starter shares its API (profiles, projects, tasks), so
  # one frontend serves them all. It talks to Plat5 from the browser; plat5 start
  # passes where Plat5 is. A starter with its own frontend runs that here instead.
  web:
    image: ghcr.io/plat5dev/template-web:v0.1.0
    labels:
      service.name: web
      service.namespace: api
    ports:
      - "3001:8080"
    environment:
      GATEWAY_URL: ${PLAT5_GATEWAY_URL:-http://localhost:5400}
      AUTH_ISSUER: ${PLAT5_AUTH_URL:-http://localhost:5401}
      AUTH_CLIENT_ID: ${PLAT5_AUTH_CLIENT_ID:-plat5}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/config.js"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  sqlite_data:
  go_mod_cache:
