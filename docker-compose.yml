# No name: the project is the directory name, so each app made from this starter is its own.

services:
  api:
    build:
      context: .
      target: local
    labels:
      service.name: api
      service.namespace: api
    # The gateway reaches this container on the Plat5 network (plat5 start puts it
    # there), so the host port is for you only: 127.0.0.1, nothing else can call
    # the API around the gateway.
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      PORT: 3000
      INTERNAL_PORT: 3001
      DATABASE_PATH: /data/app.db
      OTEL_SERVICE_NAME: api
      OTEL_SERVICE_NAMESPACE: api
      DEPLOYMENT_ENV: docker
      # Where to send traces and metrics. plat5 start sets it when observability is on.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}

    volumes:
      - .:/app
      - sqlite_data:/data
      - go_mod_cache:/go/pkg/mod
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-fsS",
          "http://127.0.0.1:3001/health/ready",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  sqlite_data:
  go_mod_cache:
